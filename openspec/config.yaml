schema: micro

# The micro loop — the only schema this repo ships. One change, one
# plan.md, one human approve before code.
context: |
  Conversation is exploration: read code, search docs, ask the human —
  nothing gates reading, and openspec/**, docs/**, skills/** are free
  drafting ground.
  Ask before planning: list every ambiguity and ask concise clarifying
  questions; the resolved answers go into plan.md's Questions & Decisions.
  Keep plans small: 1–3 slices per mini-iteration, every task small and
  verifiable.
  Run automated checks (typecheck/test/lint) before handing back for the
  human's hands-on validation and eospec close.
