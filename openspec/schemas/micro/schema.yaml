name: micro
version: 1
x-declares: [start the spec, skip the spec]
x-declares-bare: [skip the spec]
description: "The zero-bureaucracy micro loop — one change, one file, one hard
  gate. Conversation is exploration: reading, searching, asking, and drafting
  are never gated. openspec/changes/<slug>/plan.md holds the whole
  mini-iteration — Goal, resolved Questions & Decisions, Tasks (1–3 slices),
  Verification — and `eospec approve` is the single boundary from drafting to
  coding. Every mutating call during coding is receipted to the change's
  `.ledger`; when the last task ticks, the change self-locks into verifying
  until the human's hands-on pass ends it with `eospec close` (archives
  immediately). Large planning lives in Jira; this schema is for the many
  small, rapid iterations between."
artifacts:
  - id: plan
    generates: plan.md
    description: One mini-iteration in one file —
      goal, decisions, tasks, verification
    template: plan.md
    instruction: 'The whole mini-iteration, one file. Goal: 2–3 lines — what
      lands, for whom. Questions & Decisions: every ambiguity resolved BEFORE
      approval as `question → decision`; open questions go back to the human,
      never into code. Tasks: small verifiable checkbox steps, 1–3 slices
      (### headings, optional); the line `slice-gates: true` pauses coding at
      slice boundaries — eospec approve advances, --all approves all.
      Verification: automated checks first (typecheck/lint/tests), then the
      one human-only act — `- [ ] Hands-on validation`. Drafting is free;
      approval is the only gate, and it opens coding.'
    requires: []
    x-sections: [Goal, Questions & Decisions, Tasks, Verification]
    x-unlocks: [writes]
    x-completes: approved
    x-verdict-line: Hands-on validation
