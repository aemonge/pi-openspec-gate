name: ramona-idea
version: 1
description: Durable parent direction answering why a capability family
  exists; parents ramona-plan value slices and never carries tasks itself
artifacts:
  - id: idea
    generates: idea.md
    description: Why and direction with constraints and children links
    template: idea.md
    instruction: |
      Answer only WHY this direction exists, never how or acceptance detail.
      Open with the pain or accident that makes the direction matter in two or
      three tight paragraphs. Follow with a Direction paragraph naming the
      chosen shape and standing boundaries, then a Constraints paragraph of
      hard limits (dependencies, secrets, scope ceiling). Close with a
      Children line listing every ramona-plan change-id that descends from
      this idea, keeping ladder linkage bidirectional. Keep the page under
      roughly fifteen lines; if it needs more, it is hiding a plan.
    requires: []
