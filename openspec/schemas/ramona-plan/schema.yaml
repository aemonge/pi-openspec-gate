name: ramona-plan
version: 7
description: One human-validatable value slice carrying the agile ladder as
  four artifacts — Idea (the agile story line), Plan (acceptance criteria,
  what done means), Execution (exactly how), and Tasks (countable
  sub-tasks); optionally parented from a ramona-idea via the idea field
artifacts:
  - id: idea
    generates: 1-idea.md
    description: Why and for whom — the agile story line
    template: idea.md
    instruction: |
      Open with the agile story line: As a {role} I {verb} so that {value}.
      The role names who benefits (a developer, operator, application user),
      never the agent. Follow with two tight paragraphs of observed pain and
      the chosen direction with hard limits. When .openspec.yaml names a
      parent idea (the plan blockquote Parent line), this artifact may be a single blockquote line
      referencing that parent and may be omitted entirely. Never acceptance
      detail, never implementation thinking, never sub-tasks.
    requires: []
  - id: plan
    generates: 2-plan.md
    description: What done means — criteria, scope, exclusions, estimate
    template: plan.md
    instruction: |
      Answer only WHAT DONE MEANS, never how, in the Human's own words —
      this artifact is the human-readable acceptance spec. Open with an H1
      naming the slice, then one blockquote carrying Estimate (range,
      confidence), Evidence, Parent (change-id when one exists), and Human
      wait as short labelled lines. Use H2 sections for Done when (observable
      criteria, the final one Human-verified), Scope, and Exclusions. One
      page maximum; this is the page a Human skims to decide whether to
      proceed.
    requires:
      - idea
  - id: execution
    generates: 3-execution.md
    description: Exactly how — skills, workflow, steps, verification, authority
    template: execution.md
    instruction: |
      Answer exactly HOW — the only home for implementation thinking. Open
      with an H1 and one blockquote confirming the Estimate from the plan,
      restating Human wait, and naming Parents (idea or parent change-id).
      Never repeat plan content — reference it. Use H2 sections for Skills
      (required, first — see below), Workflow (one blockquoted rationale
      line), Steps (numbered, each runnable), Verification (deterministic
      checks plus concrete Human validation), Safety and authority (including
      any explicit permission required), and History (the declared snapshot
      or commit subject). Depth scales with risk: a one-command slice keeps
      this page short.
      The Skills section sits between the opening blockquote and Workflow
      and is never omitted — skill selection is domain-agnostic: code,
      cooking, games, shopping guides. Name each selected skill (any format,
      from a one-line markdown skill to a full QMD stack) with what it
      informs, then list load-bearing decisions left uncovered. When nothing
      qualifies, declare exactly one line `bare — <reason>` with an optional
      candidate skill to author later; bare lines are visible debt, never a
      silent skip.
    requires:
      - plan
  - id: tasks
    generates: 4-tasks.md
    description: Execution truth — countable sub-tasks, timing, receipts,
      validation last
    template: tasks.md
    instruction: |
      Record WHAT ACTUALLY HAPPENED. Start with the literal H1 Tasks and the
      step-states legend line, then one H2 per Task in the form
      Task N — title. Sub-tasks are checkbox lines in the form
      Step N — action, indented beneath the Task, each carrying start,
      elapsed, check, and paths or receipt slots filled in as execution
      proceeds. The final countable checkbox is always Human validation with
      response, outcome, and at slots; only a Human reply ticks it. Every
      checkbox line must remain machine-countable: keep timing and receipts
      on indented non-checkbox lines. The counter follows the
      schema-declared filename; only schema-less changes fall back to
      tasks.md. Status truth lives in the counter, never in prose.
    requires:
      - execution
