name: spec
version: 2
description: One human-validatable value slice as a six-step ladder — Idea (why) → Requirements drafted
  (the first pass) → Research (what we know — several alternatives) → Requirements refined (the research-driven
  steering) → Plan (how — estimate and the committed route) → Tasks (the ledger). Approvals flow down
  step by step, evidence flows up; the claim born at the refined requirements' final Done-when criterion
  is judged by Tasks' final Human-validation checkbox. Files are number-prefixed in grant order so the
  directory sorts as the ladder. x- tags declare the human gates that pi-openspec-gate enforces; openspec
  itself strips them silently, so the gate validates its own tags.
artifacts:
- id: idea
  generates: 1-idea.md
  description: Why and for whom — the pain, and the questions it raises
  template: 1-idea.md
  instruction: 'Answer WHY this spec exists — the problem only. Sections: an

    optional Parent blockquote (a parented spec may reduce this

    artifact to that single line); Pain — two to four sentences of

    observed pain, no solutions; Questions — the open questions this

    idea raises: the drafted requirements answer the what-questions,

    Research answers the how-might-we questions. The one-line Goal

    lives in .openspec.yaml (meta goal:), not here. Free step —

    ladder entry, never gated.

    '
  requires: []
  x-sections:
  - Pain
  - Questions
  x-grant-verb: propose
- id: requirements
  generates: 2-drafted-requirements.md
  description: What done means — the drafted first pass
  template: 2-drafted-requirements.md
  instruction: 'Observable criteria, scope, non-goals, and guardrails — the full

    sheet: Done when · Scope · Out of Scope · Guardrails (the only

    home of hard limits). No meta blockquotes: Estimate and

    confidence live on the Plan; the human-only act is named in

    Plan''s Verification; Parent lives in .openspec.yaml. This pass

    must retire or sharpen at least one of the Idea''s Questions.

    Research follows it and drives the refined pass.

    '
  requires:
  - idea
  x-requires-approval:
  - idea
  x-sections:
  - Done when
  - Scope
  - Out of Scope
  - Guardrails
  x-grant-verb: draft
- id: research
  generates: 3-research.md
  description: What we know — findings, options, dated evidence, several alternatives
  template: 3-research.md
  instruction: 'The investigation that de-risks the Plan, running between the

    drafted and refined requirements — its findings ARE the steering.

    Sections: Findings (facts with sources) · Options (compared

    candidates, inside Scope) · Evidence & prices — as of a dated

    line · Alternatives — two or more, each exactly three lines:

    what it is · the trade-off · pick-when. No recommendation, no

    ranking: the committed choice happens at Plan''s Workflow.

    '
  requires:
  - requirements
  x-requires-approval:
  - requirements
  x-sections:
  - Findings
  - Options
  - Evidence & prices
  - Alternatives
  x-grant-verb: research
- id: refined-requirements
  generates: 4-refined-requirements.md
  description: 'What done means — refined: research-driven steering of the drafted sheet'
  template: 4-refined-requirements.md
  instruction: 'Research is what moves requirements from drafted to refined.

    Revise the drafted sheet via recorded deltas — never silent

    overwrites — retiring or sharpening at least one more of the

    Idea''s Questions. The final Done-when criterion of this step is

    the claim Tasks judges.

    '
  requires:
  - research
  x-requires-approval:
  - research
  x-sections:
  - Done when
  - Scope
  - Out of Scope
  - Guardrails
  x-grant-verb: refine
- id: plan
  generates: 5-plan.md
  description: How — estimate, skills, the committed route, steps, verification, provenance
  template: 5-plan.md
  instruction: 'The method; the only home for implementation thinking —

    references the requirements, never repeats them. Sections in

    order: Estimate (range · confidence, pinned at plan time) ·

    Skills (first, never omitted; nothing qualifies → `bare —

    <reason>`) · Workflow (selects EXACTLY ONE of Research''s

    Alternatives, and why the others lost) · Steps (numbered,

    runnable) · Verification (deterministic checks, then the

    concrete Human validation naming the one human-only act) ·

    History (commit subject, or prices-as-of-date). Depth scales

    with risk.

    '
  requires:
  - refined-requirements
  x-requires-approval:
  - refined-requirements
  x-sections:
  - Estimate
  - Skills
  - Workflow
  - Steps
  - Verification
  - History
  x-grant-verb: plan
- id: tasks
  generates: 6-tasks.md
  description: The ledger — what actually happened, receipts, and the verdict
  template: 6-tasks.md
  instruction: 'Record WHAT ACTUALLY HAPPENED. Literal H1 Tasks, the step-states

    legend line, one H2 per Task with a `> Spec: <slug>` blockquote,

    checkbox steps carrying start, elapsed, check, and

    paths-or-receipt slots on indented non-checkbox lines.

    Gate-appended receipts (tool · paths · UTC) land while work

    runs. The final countable checkbox is always Human validation —

    response, outcome, at; only a Human reply ticks it. Status truth

    lives in counters, never prose. Approving this step completes

    the ladder.


    Every checkbox state change lands as exactly one git commit — message

    `<slug>: Task N Step M — <title> [state]` — the commit is the receipt; a

    tick without a hash in its commit: slot is not done. No repo → `commit:

    n/a — no repo` — visible debt, never silent.'
  requires:
  - plan
  x-requires-approval:
  - plan
  x-grant-verb: execute
