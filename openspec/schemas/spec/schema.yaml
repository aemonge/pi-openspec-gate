name: spec
version: 10
x-declares: [start the spec, skip the spec]
description: "Coding runs in one of two modes — human-coder assisted
  by pi conversation, or pi-coder gated by openspec — and the choice
  comes before any spec is started. Hand-off is always the human's
  call, at any size; the agent first reports size and complexity
  (chunk edit · multi-file · feature-scale) so the choice is informed,
  never surprised. In hand-off no change is opened, nothing is
  recorded, the agent mutates nothing — it replies in directives
  only: EDIT: path:line with the paste-ready replacement · NEW: path
  with the content · DELETE: path — and the human codes it by hand.
  The gate is untouched: a mutating call still needs focus, a change,
  or a declaration. The openspec mode is one human-validatable value
  slice as a five-step flow — Brainstorm (why + questions; research
  opens) → Investigate (de-risk) → Plan (the contract; writes
  open) → Execute (the ledger; the human verdict
  closes it) → Post-delivery (conditional; findings too big for
  slices, designed inside the change that surfaced them, drafted
  only when the verdict's surfaced: line names them). Strictness
  sits at the two boundaries humans own —
  commit at Plan, judge at the verdict. Learnings live outside the
  flow in openspec/learnings/, read by every step, written by any
  change that learned something. x- tags declare the human gates that
  eospec enforces; openspec itself strips them silently, so
  the gate validates its own tags. The declared phrases are two doors:
  skip the spec lands the next mutation as declared work; start the
  spec tells the agent to run the ceremony — create, aim, draft — which
  needs no declaration; approvals stay human-terminal either way."
artifacts:
  - id: brainstorm
    generates: 1-brainstorm.md
    x-unlocks: [research]
    description: Why and for whom — the pain, and the questions it raises
    template: 1-brainstorm.md
    instruction: 'Answer WHY this exists — the problem only. Sections:
      Pain (two to four sentences of observed pain, no solutions) ·
      Questions (the open questions — this artifact''s product; Investigate
      aims at them, Plan retires them). Direction (one mutable paragraph
      of hunch) is optional free prose. The one-line Goal lives in
      .openspec.yaml (top-level `goal:` key), not here. Free step — schema entry,
      never gated.'
    requires: []
    x-sections: [Pain, Questions]
  - id: investigate
    generates: 2-investigate.md
    description: De-risk the plan — findings, options, evidence; research instruments open here
    template: 2-investigate.md
    instruction: 'The investigation that de-risks the Plan. No declared
      structure — the journal follows what was actually found. Suggested
      shapes: Findings (facts with sources) · Options (compared, inside
      scope) · Alternatives (two or more, each three lines — what it is ·
      the trade-off · pick-when — ONLY when genuine; manufacturing one is
      lying, not research). No recommendation, no ranking: the committed
      choice happens at Plan''s Workflow. Research instruments (web, docs,
      graphify) are gated to this step — the approval that opens them is the
      human''s.'
    requires:
      - brainstorm
    x-requires-approval: [brainstorm]
    x-unlocks: [research]
  - id: plan
    generates: 3-plan.md
    description: The contract — estimate, skills, route, slices, verification; writes open here
    template: 3-plan.md
    instruction: 'The method; the only home for implementation thinking —
      references the requirements, never repeats them. Sections in order:
      Estimate (range · confidence, pinned at commit time; consult
      openspec/learnings/estimation.md) · Skills (first, never omitted;
      nothing qualifies → exactly `bare — <reason>`; consult
      openspec/learnings/skills.md) · Workflow (the committed route —
      EXACTLY ONE of Investigate''s Alternatives when there were any, and
      why the others lost; `direct, because trivial` is a valid
      one-liner) · Slices (two-level: each H3 is a Slice — the
      committable unit, ending in one conventional commit
      type(scope): subject and one post-commit human validation; under
      each Slice, checkbox Tasks as quick checkpoints, no per-Task
      commit) · Verification (deterministic checks, then the one
      human-only act, named) · History (commit subject, or
      evidence-as-of-date). Depth scales with risk. This approval is the
      docs→code boundary: writes unlock here.'
    requires:
      - investigate
    x-requires-approval: [investigate]
    x-unlocks: [writes]
    x-sections: [Estimate, Skills, Workflow, Slices, Verification, History]
  - id: execute
    generates: 4-execute.md
    description: The ledger — per-Slice checkpoints, hash-evidenced commits, and the final human verdict
    template: 4-execute.md
    instruction: 'Record WHAT ACTUALLY HAPPENED. Literal H1 Execute, the
      state-legend line, one H2 per Slice (mirroring the Plan''s H3s).
      Each Slice carries: checkbox Tasks (quick checkpoints; started_at ·
      ended_at · total · check · paths on indented non-checkbox lines; no
      per-Task commit) · a Commit checkbox (the pre-declared conventional
      message; a hash: slot beneath — a tick without a hash is not done;
      no repo → `hash: n/a — no repo`, visible debt) — the commit IS the
      receipt. Gate-appended receipts (tool · paths · UTC) land in the
      change''s sidecar (`.ledger`) while work runs — this file stays
      prose. Findings surfaced while delivering — bugs, tech debt,
      enhancements the plan could not have named — do not open a new
      spec: append the small ones as new Slices here (same tasks +
      commit-hash law) and add a one-line amendment to the Plan''s
      Slices so the mirror holds; the verdict waits until they land.
      The surfaced: line routes every named finding — slice ·
      → post-delivery — binary: the post-delivery artifact designs the
      too-big ones inside this change; a deferred finding parks through
      it (route park — the stub commit is its receipt). Post-close
      findings open their own change — parked when not walked now; the
      declared-work door covers the tiny. The final countable checkbox
      is always the declared verdict — Human validation, response ·
      outcome · surfaced: (slice · → post-delivery, one route per
      finding) — only a Human reply ticks it. Status truth lives in
      counters, never prose. Approving this artifact hands the walk to
      post-delivery when findings surfaced; the schema completes when
      post-delivery is granted or cleanly absent.'
    requires:
      - plan
    x-requires-approval: [plan]
    x-completes: approved
    x-verdict-line: Human validation
  - id: post-delivery
    generates: 5-post-delivery.md
    description: The delivery's afterlife — findings too big for slices, designed inside the change that surfaced them
    template: 5-post-delivery.md
    instruction: 'Drafts only when the delivery surfaced findings too
      big for execute''s slices — the ledger''s surfaced: line names
      them (→ post-delivery), and the verdict must be ticked first
      (x-requires-verdict): the fifth reads that routing, so the tick
      is a data dependency, not just strictness. One H2 per finding,
      in the order named: from · why here (the boundary, drawn in one
      sentence) · route · risk, then checkbox Tasks and a Commit
      checkbox with a hash: slot — the execute law, scaled down. A
      finding deferred graduates through this artifact: route park,
      one task (open the parked change stub), the stub commit is its
      receipt. No findings → never drafted: x-optional lets grant,
      room, and close skip it while absent, and it blocks hard the
      moment its file exists. A ticked Human validation closes this
      artifact''s own walk; the schema''s verdict lives in execute.'
    requires:
      - execute
    x-requires-approval: [execute]
    x-optional: true
    x-requires-verdict: true
